name: Build Android app

on:
  push:
    branches: [main]
    paths: ['android-src/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble Android project from android-src/
        run: |
          P=android/app/src/main
          mkdir -p $P/java/io/github/buildingengineeringsystems/app $P/res/xml
          cp android-src/settings.gradle android-src/build.gradle android-src/gradle.properties android/
          cp android-src/app.build.gradle android/app/build.gradle
          cp android-src/AndroidManifest.xml $P/
          cp android-src/MainActivity.java $P/java/io/github/buildingengineeringsystems/app/
          cp android-src/file_paths.xml $P/res/xml/

      - name: Add launcher icons
        run: |
          for n in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p android/app/src/main/res/mipmap-$n
            cp icon-192.png android/app/src/main/res/mipmap-$n/ic_launcher.png
          done

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          # ใช้กุญแจถาวรใน Secrets ถ้าตั้งไว้ (อัปเดตทับแอปเดิมได้)
          # ถ้าไม่ได้ตั้ง: สร้างกุญแจชั่วคราวบนเครื่อง build (เวอร์ชันใหม่ต้องลบแอปเก่าก่อนติดตั้ง)
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD_SECRET" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/engapp.jks"
            PW="$KEYSTORE_PASSWORD_SECRET"
          else
            PW="$(openssl rand -hex 16)"
            keytool -genkeypair -keystore "$RUNNER_TEMP/engapp.jks" -storetype PKCS12 -alias engapp \
              -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PW" -keypass "$PW" \
              -dname "CN=Building Engineering Systems, C=TH"
          fi
          echo "::add-mask::$PW"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/engapp.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: gradle --no-daemon assembleRelease

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk engapp.apk

      - name: Publish to GitHub Release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: แอป วิศวกรรมอาคาร v1.0.${{ github.run_number }}
          body: ดาวน์โหลด engapp.apk แล้วเปิดเพื่อติดตั้งบน Android
          make_latest: true
          files: engapp.apk
